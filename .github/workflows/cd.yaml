name: CD GitOps

on:
    push:
        branches:
        - main

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        permissions:
          contents: write

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push image to Docker Hub
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/gitopsfc:${{ github.sha }}
              ${{ secrets.DOCKER_USERNAME }}/gitopsfc:latest

        - name: Set up Kustomize
          run: |
            curl -sfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/
            kustomize version

        - name: Update kubernetes resources
          env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          run: |
            cd k8s
            kustomize edit set image goserver=${DOCKER_USERNAME}/gitopsfc:${GITHUB_SHA}

        - name: Commit and push manifest changes
          run: |
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            if git diff --quiet; then
              echo "Nenhuma mudanca nos manifests, nada a commitar"
            else
              git commit -am "Bump docker image to ${GITHUB_SHA}"
              git push
            fi
