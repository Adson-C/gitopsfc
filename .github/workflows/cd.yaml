name: CD GitOps

on:
    push:
        branches:
        - main

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Build and push image to Docker Hub
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: |
              ${{ secrets.DOCKER_USERNAME }}/gitopsfc:${{ github.sha }}
              ${{ secrets.DOCKER_USERNAME }}/gitopsfc:latest

        - name: Set up Kustomize
          uses: imranismail/setup-kustomize@v1.0.0
          with:
            kustomize-version: '3.6.1'

        - name: Update kubernetes resources
          env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          run: |
            cd k8s
            kustomize edit set image goserver=${DOCKER_USERNAME}/gitopsfc:${GITHUB_SHA}

        - name: Commit
          run: |
            git config --global user.email "github-actions@github.com"
            git config --global user.name "github-actions"
            git commit -am "Bump docker version"
        
        - name: Push
          uses: ad-m/github-push-action@master
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            repository: gitopsfc
        

        
